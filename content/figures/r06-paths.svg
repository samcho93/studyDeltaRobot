<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ROS 2에서 로봇을 움직이는 세 가지 길">
  <defs>
    <marker id="arr-r06-paths" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-r06-paths-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="box" x="20" y="40" width="280" height="62" rx="8"/>
  <text class="lbl mono" x="34" y="64" text-anchor="start">ros2 topic pub /delta/goal</text>
  <text class="sub mono" x="34" y="84" text-anchor="start">geometry_msgs/Point (TCP, m)</text>
  <path class="ln" d="M300 71 L440 150" stroke-width="2" marker-end="url(#arr-r06-paths)"/>
  <text class="tag" x="370" y="104.5" text-anchor="middle">커맨더가 직선 궤적</text>
  <rect class="box" x="20" y="120" width="280" height="62" rx="8"/>
  <text class="lbl mono" x="34" y="144" text-anchor="start">ros2 service call /delta/tool</text>
  <text class="sub mono" x="34" y="164" text-anchor="start">std_srvs/SetBool</text>
  <path class="ln" d="M300 151 L440 150" stroke-width="2" marker-end="url(#arr-r06-paths)"/>
  <text class="tag" x="370" y="144.5" text-anchor="middle">커맨더 → 툴</text>
  <rect class="box-hi" x="20" y="200" width="280" height="62" rx="8"/>
  <text class="lbl mono" x="34" y="224" text-anchor="start">DeltaRobot(backend="ros2")</text>
  <text class="sub mono" x="34" y="244" text-anchor="start">파이썬이 직접 궤적 계획</text>
  <path class="ln-hi" d="M300 231 L440 150" stroke-width="2" marker-end="url(#arr-r06-paths-hi)"/>
  <text class="tag" x="370" y="184.5" text-anchor="middle">joint_command</text>
  <rect class="box-hi" x="442" y="110" width="130" height="80" rx="16"/>
  <text class="lbl mono" x="507" y="146" text-anchor="middle">delta_driver</text>
  <text class="sub" x="507" y="166" text-anchor="middle">한계·속도 검사</text>
  <path class="ln" d="M572 150 L620 150" stroke-width="2" marker-end="url(#arr-r06-paths)"/>
  <rect class="box" x="622" y="110" width="88" height="80" rx="8"/>
  <text class="lbl" x="666" y="146" text-anchor="middle">mock</text>
  <text class="sub" x="666" y="166" text-anchor="middle">/ serial</text>
  <text class="wr" x="360" y="286" text-anchor="middle" font-size="12">어느 길이든 /delta/estop(Bool true)이 들어오면 드라이버가 멈춥니다</text>
</svg>
