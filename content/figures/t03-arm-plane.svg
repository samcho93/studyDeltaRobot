<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="팔 평면에서 본 모터각 θ와 TCP">
  <defs>
    <marker id="arr-t03-arm-plane" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-t03-arm-plane-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <path class="ln" d="M100 70 L500 70" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="tag" x="500" y="62" text-anchor="end">z = 0 (모터축 평면)</text>
  <path class="ln" d="M200 40 L200 440" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="tag" x="194" y="430" text-anchor="end">베이스 중심축</text>
  <path class="ln" d="M300 70 L481.9 70" stroke-width="1" stroke-dasharray="5 4"/>
  <path class="ln-hi" d="M300 70 L421.9 115.3" stroke-width="6" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--text-dim)" d="M421.9 115.3 L235 350" stroke-width="2.2"/>
  <path style="fill:none;stroke:var(--accent-dim)" d="M150 350 L247 350" stroke-width="6" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--text-dim)" d="M200 350 L200 420" stroke-width="3"/>
  <circle class="box" cx="300" cy="70" r="8"/>
  <circle class="hi" cx="421.9" cy="115.3" r="5"/>
  <circle class="hi" cx="235" cy="350" r="5"/>
  <circle class="hi" cx="200" cy="420" r="5"/>
  <circle class="box" cx="200" cy="350" r="4"/>
  <path class="ln" d="M355 70 A55 55 0 0 1 351.6 89.2" stroke-width="1.3" marker-end="url(#arr-t03-arm-plane)"/>
  <text class="lbl" x="362" y="62" text-anchor="start">θ (아래로 +)</text>
  <text class="tag" x="300" y="50" text-anchor="middle">모터</text>
  <text class="tag" x="431.9" y="109.3" text-anchor="start">E 팔꿈치</text>
  <text class="lbl" x="368.9" y="84.6" text-anchor="start">L</text>
  <text class="lbl" x="338.4" y="232.6" text-anchor="start">l (투영)</text>
  <text class="tag" x="245" y="354" text-anchor="start">B 볼조인트 쌍</text>
  <text class="tag" x="190" y="340" text-anchor="end">이펙터 중심 P</text>
  <text class="tag" x="210" y="424" text-anchor="start">TCP = P − (0, 0, 툴 길이)</text>
  <path class="ln" d="M200 48 L300 48" stroke-width="1" marker-end="url(#arr-t03-arm-plane)"/>
  <text class="lbl" x="250" y="42" text-anchor="middle">R</text>
  <path class="ln" d="M200 376 L235 376" stroke-width="1" marker-end="url(#arr-t03-arm-plane)"/>
  <text class="lbl" x="243" y="380" text-anchor="start">r</text>
  <rect class="box" x="470" y="120" width="275" height="170" rx="8"/>
  <text class="lbl" x="486" y="146" text-anchor="start">팔 좌표계 (팔 1 기준)</text>
  <text class="sub" x="486" y="170" text-anchor="start">모터 M = (R, 0, 0)</text>
  <text class="sub" x="486" y="192" text-anchor="start">팔꿈치 E = (R + L cos θ, 0, −L sin θ)</text>
  <text class="sub" x="486" y="214" text-anchor="start">볼조인트 B = P + r·(1, 0, 0)</text>
  <text class="sub" x="486" y="236" text-anchor="start">제약: |B − E| = l</text>
  <text class="sub" x="486" y="258" text-anchor="start">θ = 0.356 rad (P = (0, 0, −0.28))</text>
  <text class="sub" x="486" y="278" text-anchor="start">edu_dynamixel, 축척 일정</text>
</svg>
