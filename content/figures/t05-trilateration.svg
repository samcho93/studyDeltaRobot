<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세 구의 교점으로 푸는 순기구학">
  <defs>
    <marker id="arr-t05-trilateration" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-t05-trilateration-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <text class="lbl" x="190" y="30" text-anchor="middle">위에서 본 구 중심 이동: Cᵢ = Eᵢ − r·uᵢ</text>
  <circle class="box" cx="190" cy="230" r="4"/>
  <path class="ln" d="M190 230 L334.4 230" stroke-width="1" stroke-dasharray="5 4"/>
  <path class="ln-hi" d="M334.4 230 L311.6 230" stroke-width="1.8" marker-end="url(#arr-t05-trilateration-hi)"/>
  <circle class="box" cx="334.4" cy="230" r="5.5"/>
  <circle class="hi" cx="311.6" cy="230" r="5"/>
  <text class="lbl" x="363.3" y="234" text-anchor="middle">E1</text>
  <text class="tag" x="277.6" y="234" text-anchor="middle">C1</text>
  <path class="ln" d="M190 230 L117.8 105" stroke-width="1" stroke-dasharray="5 4"/>
  <path class="ln-hi" d="M117.8 105 L129.2 124.7" stroke-width="1.8" marker-end="url(#arr-t05-trilateration-hi)"/>
  <circle class="box" cx="117.8" cy="105" r="5.5"/>
  <circle class="hi" cx="129.2" cy="124.7" r="5"/>
  <text class="lbl" x="103.4" y="84" text-anchor="middle">E2</text>
  <text class="tag" x="146.2" y="158.2" text-anchor="middle">C2</text>
  <path class="ln" d="M190 230 L117.8 355" stroke-width="1" stroke-dasharray="5 4"/>
  <path class="ln-hi" d="M117.8 355 L129.2 335.3" stroke-width="1.8" marker-end="url(#arr-t05-trilateration-hi)"/>
  <circle class="box" cx="117.8" cy="355" r="5.5"/>
  <circle class="hi" cx="129.2" cy="335.3" r="5"/>
  <text class="lbl" x="103.4" y="384" text-anchor="middle">E3</text>
  <text class="tag" x="146.2" y="309.8" text-anchor="middle">C3</text>
  <text class="sub" x="190" y="400" text-anchor="middle">각 팔의 제약 |P + r·uᵢ − Eᵢ| = l</text>
  <text class="sub" x="190" y="418" text-anchor="middle">⇔ |P − Cᵢ| = l : 반지름 l 인 구 3개</text>
  <text class="lbl" x="575" y="30" text-anchor="middle">옆에서 본 두 교점 (θ₁ = θ₂ = θ₃ = 0.35 rad)</text>
  <circle style="fill:none;stroke:var(--accent);stroke-dasharray:6 4;stroke-width:1.2" cx="672.3" cy="228.2" r="156"/>
  <circle class="hi" cx="672.3" cy="228.2" r="5"/>
  <circle style="fill:none;stroke:var(--warn);stroke-dasharray:6 4;stroke-width:1.2" cx="526.3" cy="228.2" r="156"/>
  <circle class="hi" cx="526.3" cy="228.2" r="5"/>
  <text class="tag" x="680.3" y="220.2" text-anchor="start">C1</text>
  <text class="tag" x="518.3" y="220.2" text-anchor="end">C2, C3 (겹쳐 보임)</text>
  <path style="fill:none;stroke:var(--text-dim)" d="M471 228.2 L710.2 228.2" stroke-width="1.2"/>
  <text class="tag" x="710.2" y="223" text-anchor="end">세 중심의 평면</text>
  <path class="ln" d="M575 350.1 L575 106.2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle class="hi" cx="575" cy="350.1" r="6"/>
  <circle class="box" cx="575" cy="106.2" r="6"/>
  <text class="lbl" x="585" y="368.1" text-anchor="start">아래 해 z = -0.2791 (선택)</text>
  <text class="sub" x="585" y="100.2" text-anchor="start">위 해 z = 0.1899</text>
  <text class="lbl" x="567" y="289.1" text-anchor="end">h</text>
  <text class="lbl" x="567" y="167.2" text-anchor="end">h</text>
</svg>
