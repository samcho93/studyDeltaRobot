<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="델타로봇의 두 종류 특이점">
  <defs>
    <marker id="arr-t06-singularity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-t06-singularity-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <text class="lbl" x="190" y="30" text-anchor="middle">1형 (역기구학·경계) 특이점</text>
  <circle class="box" cx="60" cy="120" r="8"/>
  <path class="ln-hi" d="M60 120 L157.1 171.6" stroke-width="6" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--text-dim)" d="M157.1 171.6 L360.2 279.6" stroke-width="2.2"/>
  <circle class="hi" cx="157.1" cy="171.6" r="5"/>
  <circle class="hi" cx="360.2" cy="279.6" r="5"/>
  <path style="fill:none;stroke:var(--warn)" d="M157.1 171.6 L178.3 211.4" stroke-width="1.6" marker-end="url(#arr-t06-singularity)"/>
  <text class="tag" x="184.3" y="223.4" text-anchor="start">∂E/∂θ</text>
  <path class="ln-hi" d="M166 176.3 L227.8 209.2" stroke-width="1.6" marker-end="url(#arr-t06-singularity-hi)"/>
  <text class="lbl" x="231.8" y="197.2" text-anchor="start">sᵢ</text>
  <text class="sub" x="40" y="300" text-anchor="start">위팔과 아래팔이 일직선 (완전히 펴짐/접힘)</text>
  <text class="sub" x="40" y="318" text-anchor="start">sᵢ · ∂Eᵢ/∂θᵢ = 0 → Jθ의 i번째 값이 0</text>
  <text class="sub" x="40" y="336" text-anchor="start">그 방향으로는 움직일 수 없음 (작업영역 경계)</text>
  <text class="lbl" x="570" y="30" text-anchor="middle">2형 (병렬·순기구학) 특이점</text>
  <path class="ln" d="M440 160 L700 160" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="tag" x="700" y="182" text-anchor="end">세 로드가 한 평면</text>
  <circle class="box" cx="420" cy="70" r="8"/>
  <path class="ln-hi" d="M420 70 L450 160" stroke-width="6" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--text-dim)" d="M450 160 L540 160" stroke-width="2.2"/>
  <circle class="hi" cx="450" cy="160" r="5"/>
  <circle class="box" cx="720" cy="70" r="8"/>
  <path class="ln-hi" d="M720 70 L690 160" stroke-width="6" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--text-dim)" d="M690 160 L600 160" stroke-width="2.2"/>
  <circle class="hi" cx="690" cy="160" r="5"/>
  <path style="fill:none;stroke:var(--accent-dim)" d="M535 160 L605 160" stroke-width="7" stroke-linecap="round"/>
  <path style="fill:none;stroke:var(--danger)" d="M570 152 L570 100" stroke-width="1.6" marker-end="url(#arr-t06-singularity)"/>
  <path style="fill:none;stroke:var(--danger)" d="M570 168 L570 220" stroke-width="1.6" marker-end="url(#arr-t06-singularity)"/>
  <text class="tag" x="560" y="216" text-anchor="end">모터를 고정해도</text>
  <text class="tag" x="560" y="232" text-anchor="end">위아래로 움직임</text>
  <text class="sub" x="440" y="300" text-anchor="start">s₁, s₂, s₃ 가 한 평면에 놓임 → det Jx = 0</text>
  <text class="sub" x="440" y="318" text-anchor="start">순기구학의 두 해(위·아래)가 합쳐지는 곳 (h = 0)</text>
  <text class="sub" x="440" y="336" text-anchor="start">강성 상실, 작은 힘에도 큰 모터 토크 필요</text>
</svg>
