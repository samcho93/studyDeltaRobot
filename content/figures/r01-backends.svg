<svg viewBox="0 0 720 365" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeltaRobot 하나에 백엔드 네 개">
  <defs>
    <marker id="arr-r01-backends" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-r01-backends-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="box-hi" x="20" y="120" width="170" height="90" rx="10"/>
  <text class="lbl" x="105" y="148" text-anchor="middle">학생 코드</text>
  <text class="sub mono" x="105" y="170" text-anchor="middle">robot.arch_to(...)</text>
  <text class="sub mono" x="105" y="190" text-anchor="middle">robot.tool_on()</text>
  <rect class="box" x="230" y="90" width="190" height="150" rx="10"/>
  <text class="lbl" x="325" y="116" text-anchor="middle">DeltaRobot</text>
  <text class="sub" x="325" y="140" text-anchor="middle">① 경로 계획 (아치·직선)</text>
  <text class="sub" x="325" y="160" text-anchor="middle">② 속도 프로파일 샘플링</text>
  <text class="sub" x="325" y="180" text-anchor="middle">③ IK + 한계 검사</text>
  <text class="sub" x="325" y="200" text-anchor="middle">④ 모터각 스트림 (10 ms)</text>
  <text class="tag mono dg" x="325" y="224" text-anchor="middle">WorkspaceError</text>
  <path class="ln-hi" d="M190 165 L228 165" stroke-width="2" marker-end="url(#arr-r01-backends-hi)"/>
  <path class="ln-hi" d="M420 165 C450 165 450 50 480 50" stroke-width="1.6" marker-end="url(#arr-r01-backends-hi)"/>
  <rect class="box-hi" x="482" y="20" width="218" height="62" rx="8"/>
  <text class="lbl mono" x="496" y="42" text-anchor="start">record</text>
  <text class="sub" x="496" y="60" text-anchor="start">가상 시간 · Playground</text>
  <text class="tag mono" x="496" y="76" text-anchor="start">frames → 시뮬 재생</text>
  <path class="ln" d="M420 165 C450 165 450 125 480 125" stroke-width="1.6" marker-end="url(#arr-r01-backends)"/>
  <rect class="box" x="482" y="95" width="218" height="62" rx="8"/>
  <text class="lbl mono" x="496" y="117" text-anchor="start">websim</text>
  <text class="sub" x="496" y="135" text-anchor="start">PC → 웹 시뮬 실시간</text>
  <text class="tag mono" x="496" y="151" text-anchor="start">ws://127.0.0.1:8765</text>
  <path class="ln" d="M420 165 C450 165 450 200 480 200" stroke-width="1.6" marker-end="url(#arr-r01-backends)"/>
  <rect class="box" x="482" y="170" width="218" height="62" rx="8"/>
  <text class="lbl mono" x="496" y="192" text-anchor="start">ros2</text>
  <text class="sub" x="496" y="210" text-anchor="start">delta_driver 노드</text>
  <text class="tag mono" x="496" y="226" text-anchor="start">/delta/joint_command</text>
  <path class="ln" d="M420 165 C450 165 450 275 480 275" stroke-width="1.6" marker-end="url(#arr-r01-backends)"/>
  <rect class="box" x="482" y="245" width="218" height="62" rx="8"/>
  <text class="lbl mono" x="496" y="267" text-anchor="start">serial</text>
  <text class="sub" x="496" y="285" text-anchor="start">아두이노 펌웨어</text>
  <text class="tag mono" x="496" y="301" text-anchor="start">J d1 d2 d3 (115200)</text>
  <text class="tag" x="360" y="330" text-anchor="middle">backend= 인자만 바꾸면 같은 코드가 시뮬 → PC → ROS 2 → 실물로</text>
  <text class="sub" x="360" y="350" text-anchor="middle">serial·ros2는 모터 속도 초과를 거부, record·websim은 경고만</text>
</svg>
